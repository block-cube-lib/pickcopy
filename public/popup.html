<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Scriptable Copy</title>
    <style>
      * {
        box-sizing: border-box;
      }

      /* Layout: header, scrollable middle, footer, all in normal flow.
         Do NOT give html/body height:100% or make the middle a flex-grow
         scroll area: Chrome sizes the popup from the content's intrinsic
         height, and a scrollable flex child contributes ~0 to it, which
         collapsed the whole settings area to a thin strip. Instead the
         middle is capped with max-height, so the popup grows with the
         content up to the cap and only the middle scrolls beyond it.
         The whole popup never exceeds Chrome's 600px popup height. */
      body {
        width: 450px;
        font-family: Arial, sans-serif;
        margin: 0;
      }

      .popup-header {
        padding: 12px 12px 0 12px;
      }

      .popup-main {
        max-height: 395px;
        overflow-y: auto;
        padding: 0 12px;
      }

      .popup-footer {
        flex: none;
        padding: 10px 12px 12px 12px;
        border-top: 1px solid #ddd;
        background-color: #fff;
      }

      h3 {
        margin: 0 0 10px 0;
        font-size: 1.3em;
        color: #333;
      }

      #copyButton {
        width: 100%;
        padding: 10px;
        font-size: 1.1em;
        font-weight: bold;
        background-color: #4caf50;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        margin-bottom: 12px;
      }

      #copyButton:hover {
        background-color: #45a049;
      }

      .flex-end {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 8px;
      }

      .group {
        margin-bottom: 12px;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
        background-color: #f9f9f9;
      }

      .group-title {
        font-size: 0.9em;
        font-weight: bold;
        color: #666;
        margin-bottom: 6px;
      }

      textarea, input:not([type='checkbox']) {
        width: 100%;
        margin-bottom: 8px;
        padding: 6px 8px;
        border-radius: 5px;
        border: 1px solid #ccc;
        font-family: inherit;
        font-size: 0.95em;
      }

      textarea {
        resize: vertical;
      }

      #preview {
        height: 50px;
        margin-bottom: 6px;
      }

      #selectors, #format {
        height: 45px;
        margin-bottom: 8px;
      }

      #settingName, #urlPattern {
        margin-bottom: 8px;
      }

      select {
        width: 100%;
        border-radius: 5px;
        border: 1px solid #ccc;
        padding: 4px;
        margin-bottom: 8px;
      }

      .section-title {
        font-size: 1em;
        font-weight: bold;
        color: #333;
        margin: 12px 0 6px 0;
      }

      button {
        padding: 6px 12px;
        border-radius: 4px;
        border: 1px solid #ccc;
        background-color: #fff;
        cursor: pointer;
      }

      button:hover {
        background-color: #f0f0f0;
      }

      button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      button:disabled:hover {
        background-color: #fff;
      }

      #addSettingButton {
        font-weight: bold;
        background-color: #e0e0e0;
      }

      #saveSettingButton {
        background-color: #2196f3;
        color: white;
        border: none;
      }

      #saveSettingButton:hover {
        background-color: #1e88e5;
      }

      #saveSettingButton:disabled:hover {
        background-color: #2196f3;
      }

      #allSettingsLink {
        text-align: center;
        display: block;
        margin-top: 10px;
        color: #2196f3;
        text-decoration: none;
        font-size: 0.9em;
      }

      #allSettingsLink:hover {
        text-decoration: underline;
      }

      .message {
        display: none;
        font-size: 0.85em;
        color: green;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <header class="popup-header">
      <h3>Scriptable Copy</h3>
      <button id="copyButton">Copy to Clipboard</button>
    </header>

    <main class="popup-main">
      <div class="group" id="previewGroup">
        <div class="group-title">Preview</div>
        <textarea id="preview"></textarea>
        <div class="flex-end">
          <div class="message" id="copiedMessage">Copied</div>
          <button id="updatePreviewButton">Update Preview</button>
        </div>
      </div>

      <div class="section-title">Setting Selector</div>

      <div class="group">
        <div style="margin-bottom: 8px">
          <input
            type="checkbox"
            id="urlPatterFilterEnabledCheckBox"
            value="urlPatternFilterEnabled"
          />
          <label for="urlPatterFilterEnabledCheckBox">URL Pattern Filter</label>
        </div>
        <select id="settingSelector" size="3"></select>
        <div class="flex-end" style="margin-bottom: 8px">
          <button id="addSettingButton">+</button>
          <button id="pickElementButton">Pick element from page</button>
          <button id="editInWindowButton">Edit in Window</button>
        </div>
        <div id="customSettingView">
          <input id="settingName" placeholder="Enter name for the setting" />
          <textarea
            id="selectors"
            placeholder="Enter selectors, one per line"
          ></textarea>
          <textarea
            id="format"
            placeholder="Enter format string (e.g., 'Title: {Title}, URL: {URL}')"
          ></textarea>
          <input id="urlPattern" placeholder="URL Pattern" />
        </div>
      </div>
    </main>

    <footer class="popup-footer">
      <div class="flex-end">
        <div class="message" id="savedMessage">Saved</div>
        <button id="saveSettingButton">Save Settings</button>
      </div>
      <a id="allSettingsLink" href="settings.html" target="_blank"
      >View All Settings</a>
    </footer>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
