<!DOCTYPE html>
<html>
<head>
  <title>Edit Setting</title>
  <style>
    body {
      width: 600px;
      padding: 10px;
      font-family: Arial, sans-serif;
    }
    textarea, input {
      width: 100%;
      margin-bottom: 10px;
      padding: 8px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    .button-row {
      display: flex;
      justify-content: space-between;
    }
    .button-row button {
      padding: 10px;
      width: 48%;
    }
    #deleteButton {
      background-color: #f44336;
      color: white;
      border: none;
    }
    .message {
      display: none;
      text-align: center;
      padding: 8px;
      margin-bottom: 10px;
      border-radius: 5px;
      background-color: #4CAF50;
      color: white;
    }
  </style>
</head>
<body>
  <h3>Edit Setting</h3>
  <div class="message" id="savedMessage">Saved!</div>
  <input id="settingName" placeholder="Enter name for the setting"/>
  <textarea id="selectors" placeholder="Enter selectors, one per line" rows="5"></textarea>
  <textarea id="format" placeholder="Enter format string (e.g., 'Title: {Title}, URL: {URL}')" rows="3"></textarea>
  <input id="urlPattern" placeholder="URL Pattern"/>
  <div class="button-row">
    <button id="saveButton">Save</button>
    <button id="deleteButton">Delete</button>
  </div>
  <script type="module" src="./settings.js"></script>
</body>
</html>

<body>
  <h3>All Settings</h3>
  <div id="settingsList"></div>
  <button id="exportSettings">Export Settings</button>
  <input type="file" id="importFile" style="display:none" />
  <button id="importFileButton">Import Settings from File</button>
  <button id="importPasteButton">Import Settings from JSON</button>
  <textarea id="importTextArea" placeholder="Paste JSON here" style="display:none"></textarea>
  <script src="settings.js"></script>
</body>
</html>
