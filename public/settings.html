<!DOCTYPE html>
<html>
  <head>
    <title>Scriptable Copy - Settings</title>
    <style>
      body {
        width: 600px;
        padding: 15px;
        font-family: Arial, sans-serif;
        box-sizing: border-box;
        margin: 0;
      }
      h3 {
        margin-top: 0;
      }
      textarea, input {
        width: 100%;
        margin-bottom: 10px;
        padding: 8px;
        border-radius: 5px;
        border: 1px solid #ccc;
        box-sizing: border-box;
      }
      button {
        padding: 10px;
        border-radius: 5px;
        border: 1px solid #ccc;
        cursor: pointer;
      }
      .button-row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }
      .button-row button {
        flex: 1;
      }
      #deleteButton {
        background-color: #f44336;
        color: white;
        border: none;
      }
      .message {
        display: none;
        text-align: center;
        padding: 8px;
        margin-bottom: 10px;
        border-radius: 5px;
        background-color: #4caf50;
        color: white;
      }
      .setting-item {
        margin-bottom: 15px;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 5px;
        background-color: #f9f9f9;
        position: relative;
      }
      .setting-item .delete-btn {
        position: absolute;
        top: 10px;
        right: 10px;
        background-color: #f44336;
        color: white;
        border: none;
        padding: 5px 10px;
        border-radius: 3px;
      }
      .setting-item-title {
        font-weight: bold;
        font-size: 1.1em;
        margin-bottom: 5px;
      }
      .setting-item-detail {
        font-size: 0.9em;
        color: #555;
        margin-bottom: 3px;
      }
      .view-container {
        display: none;
      }
      .import-export-row {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 15px;
      }
      .import-export-row button {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <!-- Edit Setting View -->
    <div id="editSettingView" class="view-container">
      <h3>Edit Setting</h3>
      <div class="message" id="savedMessage">Saved!</div>
      <input id="settingName" placeholder="Enter name for the setting" />
      <textarea
        id="selectors"
        placeholder="Enter selectors, one per line"
        rows="5"
      ></textarea>
      <textarea
        id="format"
        placeholder="Enter format string (e.g., 'Title: {Title}, URL: {URL}')"
        rows="3"
      ></textarea>
      <input id="urlPattern" placeholder="URL Pattern" />
      <div class="button-row">
        <button
          id="saveButton"
          style="background-color: #4caf50; color: white; border: none"
        >
          Save
        </button>
        <button id="deleteButton">Delete</button>
      </div>
    </div>

    <!-- All Settings View -->
    <div id="allSettingsView" class="view-container">
      <h3>All Settings</h3>
      <div id="settingsList"></div>
      <div class="import-export-row">
        <button
          id="exportSettings"
          style="background-color: #2196f3; color: white; border: none"
        >
          Export Settings
        </button>
        <input
          type="file"
          id="importFile"
          style="display: none"
          accept=".json"
        />
        <button id="importFileButton">Import Settings from File</button>
        <button id="importPasteButton">Import Settings from JSON</button>
        <textarea
          id="importTextArea"
          placeholder="Paste JSON here and click outside/press Enter to import"
          rows="4"
          style="display: none"
        ></textarea>
      </div>
    </div>

    <script type="module" src="./settings.js"></script>
  </body>
</html>
